name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    env:
      DOTNET_MULTILEVEL_LOOKUP: "0"
      MSBuildEnableWorkloadResolver: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets
            PrintMeter.sln

      - name: Pin .NET SDK to 9.x for this run
        shell: pwsh
        run: |
          @'
          {
            "sdk": {
              "version": "9.0.100",
              "rollForward": "latestFeature"
            }
          }
          '@ | Out-File -FilePath global.json -Encoding utf8
          dotnet --version
          dotnet --list-sdks

      - name: Dotnet info
        run: dotnet --info

      - name: Restore
        run: dotnet restore PrintMeter.sln --nologo

      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          dotnet build PrintMeter.sln -c Release --no-restore -v:d -bl:artifacts/ci.binlog

      - name: Test
        run: dotnet test PrintMeter.sln -c Release --no-build --collect:"XPlat Code Coverage"

      - name: Dump XAML compiler context on failure
        if: failure()
        shell: pwsh
        run: |
          $objRoot = "src/PrintMeter.App/obj/Release/net8.0-windows10.0.22621.0"
          $inputJson = Join-Path $objRoot "input.json"
          $outputJson = Join-Path $objRoot "output.json"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $inputHead = "artifacts/xaml-input-head.txt"
          $outputHead = "artifacts/xaml-output-head.txt"
          $objListing = "artifacts/xaml-obj-files.txt"

          Write-Host "== XAML compiler context =="
          Write-Host "objRoot: $objRoot"
          if (Test-Path $inputJson) {
            Write-Host "input.json exists: yes"
            Write-Host "--- input.json (first 300 lines) ---"
            Get-Content $inputJson | Select-Object -First 300 | Tee-Object -FilePath $inputHead
          } else {
            Write-Host "input.json exists: no"
            "input.json not found at $inputJson" | Out-File -FilePath $inputHead -Encoding utf8
          }

          if (Test-Path $outputJson) {
            Write-Host "output.json exists: yes"
            Write-Host "--- output.json (first 300 lines) ---"
            Get-Content $outputJson | Select-Object -First 300 | Tee-Object -FilePath $outputHead
          } else {
            Write-Host "output.json exists: no"
            "output.json not found at $outputJson" | Out-File -FilePath $outputHead -Encoding utf8
          }

          Write-Host "--- obj error/log candidates ---"
          Get-ChildItem -Path $objRoot -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in @(".err", ".log", ".txt", ".json") } |
            Select-Object FullName, Length | Tee-Object -FilePath $objListing

      - name: Upload Windows diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics-${{ github.run_attempt }}-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            artifacts/ci.binlog
            artifacts/xaml-*.txt
            src/PrintMeter.App/obj/**/*
