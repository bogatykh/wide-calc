name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets
            PrintMeter.sln

      - name: Restore
        run: dotnet restore PrintMeter.sln --nologo

      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          dotnet build PrintMeter.sln -c Release --no-restore -v:d -bl:artifacts/ci.binlog

      - name: Test
        run: dotnet test PrintMeter.sln -c Release --no-build --collect:"XPlat Code Coverage"

      - name: Upload Windows diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics-${{ github.run_attempt }}-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            artifacts/ci.binlog
            src/PrintMeter.App/obj/**/*
