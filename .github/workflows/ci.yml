name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # Windows App SDK 1.6 требует Microsoft.Windows.SDK.NET.Ref (SDK ≥ 8.0.402).
          dotnet-version: "8.0.404"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets
            PrintMeter.sln

      - name: Restore
        run: dotnet restore PrintMeter.sln --nologo

      - name: Build
        run: dotnet build PrintMeter.sln -c Release --no-restore

      - name: Test
        run: dotnet test PrintMeter.sln -c Release --no-build --collect:"XPlat Code Coverage"
