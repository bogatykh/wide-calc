# One-off recovery when a merged release PR still has autorelease:pending (blocks new release PRs).
# Does not create git tags or GitHub releases — only fixes labels. Needs a normal GITHUB_TOKEN.
name: release-please-unstick

on:
  workflow_dispatch:
    inputs:
      pull_number:
        description: "Merged release PR number (e.g. 13)"
        required: true
        type: number

permissions:
  issues: write
  pull-requests: write

jobs:
  relabel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const n = ${{ inputs.pull_number }};
            const { owner, repo } = context.repo;
            try {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: n,
                name: 'autorelease: pending',
              });
              core.info('Removed autorelease: pending');
            } catch (e) {
              core.info(`removeLabel pending: ${e.message}`);
            }
            try {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: n,
                labels: ['autorelease: tagged'],
              });
              core.info('Added autorelease: tagged');
            } catch (e) {
              core.info(`addLabels tagged: ${e.message}`);
            }
