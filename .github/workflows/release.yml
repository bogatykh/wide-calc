name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    env:
      DOTNET_MULTILEVEL_LOOKUP: "0"
      MSBuildEnableWorkloadResolver: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets
            PrintMeter.sln

      - name: Restore
        run: dotnet restore PrintMeter.sln --nologo

      - name: Test
        run: dotnet test PrintMeter.Mac.slnf -c Release --no-restore --nologo

      - uses: microsoft/setup-msbuild@v2

      - name: Restore App with RID
        run: >
          dotnet restore src/PrintMeter.App/PrintMeter.App.csproj
          -r win-x64
          --nologo

      - name: Publish
        shell: pwsh
        run: |
          msbuild src/PrintMeter.App/PrintMeter.App.csproj `
            /t:Publish `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:Restore=false `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=true `
            /p:WindowsAppSDKSelfContained=true `
            /p:PublishTrimmed=false `
            /p:PublishDir=${{ github.workspace }}/artifacts/publish/ `
            /m `
            /v:m

      - name: Verify PRI next to publish output
        shell: pwsh
        run: |
          Get-ChildItem -Path ./artifacts/publish -Filter *.pri -Recurse | ForEach-Object { $_.FullName }
          if (-not (Test-Path ./artifacts/publish/PrintMeter.pri) -and -not (Test-Path ./artifacts/publish/resources.pri)) {
            Write-Error 'Expected PrintMeter.pri or resources.pri in publish root (app MRT map).'
            exit 1
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "${{ github.event.release.tag_name }}"
          }
          $v = $tag.TrimStart('v')
          "value=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build Installer
        shell: pwsh
        run: >
          iscc /DMyAppVersion=${{ steps.version.outputs.value }}
          installer/PrintMeter.iss

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path ./artifacts/publish/* -DestinationPath ./artifacts/PrintMeter-win-x64.zip

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            artifacts/PrintMeter-win-x64.zip
            artifacts/installer/PrintMeter-Setup-x64.exe
          append_body: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
