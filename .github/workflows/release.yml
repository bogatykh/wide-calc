name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets
            PrintMeter.sln

      - name: Restore
        run: dotnet restore PrintMeter.sln --nologo

      - name: Build
        run: dotnet build PrintMeter.sln -c Release --no-restore --nologo

      - name: Restore App with RID
        run: >
          dotnet restore src/PrintMeter.App/PrintMeter.App.csproj
          -r win-x64
          -p:PublishReadyToRun=true
          --nologo

      - name: Publish
        run: >
          dotnet publish src/PrintMeter.App/PrintMeter.App.csproj
          -c Release
          --no-restore
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -p:PublishReadyToRun=true
          -o ./artifacts/publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "${{ github.event.release.tag_name }}"
          }
          $v = $tag.TrimStart('v')
          "value=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build Installer
        shell: pwsh
        run: >
          iscc /DMyAppVersion=${{ steps.version.outputs.value }}
          installer/PrintMeter.iss

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path ./artifacts/publish/* -DestinationPath ./artifacts/PrintMeter-win-x64.zip

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            artifacts/PrintMeter-win-x64.zip
            artifacts/installer/PrintMeter-Setup-x64.exe
          append_body: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
