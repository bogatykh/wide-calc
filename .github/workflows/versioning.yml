name: versioning

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          command: manifest
          token: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          skip-github-release: true

  publish-release-assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets
            PrintMeter.sln

      - name: Restore
        run: dotnet restore PrintMeter.sln --nologo

      - name: Build
        run: dotnet build PrintMeter.sln -c Release --no-restore --nologo

      - name: Restore App with RID
        run: >
          dotnet restore src/PrintMeter.App/PrintMeter.App.csproj
          -r win-x64
          -p:PublishReadyToRun=true
          --nologo

      - name: Publish
        run: >
          dotnet publish src/PrintMeter.App/PrintMeter.App.csproj
          -c Release
          --no-restore
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -p:PublishReadyToRun=true
          -o ./artifacts/publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ needs.release-please.outputs.tag_name }}"
          $v = $tag.TrimStart('v')
          "value=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build Installer
        shell: pwsh
        run: >
          iscc /DMyAppVersion=${{ steps.version.outputs.value }}
          installer/PrintMeter.iss

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path ./artifacts/publish/* -DestinationPath ./artifacts/PrintMeter-win-x64.zip

      - name: Create release with assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            artifacts/PrintMeter-win-x64.zip
            artifacts/installer/PrintMeter-Setup-x64.exe
          generate_release_notes: true
          append_body: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
