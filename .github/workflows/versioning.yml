name: versioning

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to backfill assets (e.g. v0.2.3)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Explicit permissions: org "Workflow permissions" can otherwise cap GITHUB_TOKEN to read-only.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Do not set skip-github-release: merged release PRs must get a GitHub release + tag
      # in this run, or autorelease:pending is never cleared and new release PRs are blocked
      # ("untagged, merged release PRs outstanding").
      # Uses the action default token (GITHUB_TOKEN): see action.yml default on release-please-action@v4.
      # Do NOT set RELEASE_PLEASE_TOKEN unless you really need it: a narrow fine‑grained PAT often
      # returns "Resource not accessible by integration" on POST /releases. Then either delete that
      # secret or recreate a classic PAT with `repo`. To opt into a PAT, add:
      #   token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          target-branch: main

  publish-release-assets:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true' || github.event.inputs.release_tag != ''
    runs-on: windows-2022
    env:
      DOTNET_MULTILEVEL_LOOKUP: "0"
      MSBuildEnableWorkloadResolver: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets
            PrintMeter.sln

      - name: Restore
        run: dotnet restore PrintMeter.sln --nologo

      - name: Test
        run: dotnet test PrintMeter.Mac.slnf -c Release --no-restore --nologo

      - uses: microsoft/setup-msbuild@v2

      - name: Restore App with RID
        run: >
          dotnet restore src/PrintMeter.App/PrintMeter.App.csproj
          -r win-x64
          -p:PublishReadyToRun=true
          --nologo

      - name: Publish
        shell: pwsh
        run: |
          msbuild src/PrintMeter.App/PrintMeter.App.csproj `
            /t:Publish `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:Restore=false `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=true `
            /p:WindowsAppSDKSelfContained=true `
            /p:PublishTrimmed=false `
            /p:PublishReadyToRun=true `
            /p:PublishDir=${{ github.workspace }}/artifacts/publish/ `
            /m `
            /v:m

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.release_tag }}"
          git fetch --tags --force
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = git tag --points-at HEAD | Sort-Object | Select-Object -Last 1
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = git tag --sort=-creatordate | Select-Object -First 1
          }
          $v = $tag.TrimStart('v')
          "value=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout target tag
        run: git checkout ${{ steps.version.outputs.tag }}

      - name: Build Installer
        shell: pwsh
        run: >
          iscc /DMyAppVersion=${{ steps.version.outputs.value }}
          installer/PrintMeter.iss

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path ./artifacts/publish/* -DestinationPath ./artifacts/PrintMeter-win-x64.zip

      # Release Please already created the GitHub release + tag; only attach binaries.
      # Omit name/body/generate_release_notes so the existing release keeps RP changelog text.
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            artifacts/PrintMeter-win-x64.zip
            artifacts/installer/PrintMeter-Setup-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
